apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 3
  selector:
    matchLabels: {app: api-gateway}
  template:
    metadata:
      labels: {app: api-gateway}
    spec:
      containers:
        - name: gateway
          image: api-monetization/gateway:latest
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: api-monetization-config}}]
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet
spec:
  replicas: 2
  selector:
    matchLabels: {app: wallet}
  template:
    metadata:
      labels: {app: wallet}
    spec:
      containers:
        - name: wallet
          image: api-monetization/wallet:latest
          ports: [{containerPort: 9090}]
          envFrom: [{configMapRef: {name: api-monetization-config}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metering
spec:
  replicas: 2
  selector:
    matchLabels: {app: metering}
  template:
    metadata:
      labels: {app: metering}
    spec:
      containers:
        - name: metering
          image: api-monetization/metering:latest
          envFrom: [{configMapRef: {name: api-monetization-config}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
spec:
  replicas: 2
  selector:
    matchLabels: {app: billing}
  template:
    metadata:
      labels: {app: billing}
    spec:
      containers:
        - name: billing
          image: api-monetization/billing:latest
          envFrom: [{configMapRef: {name: api-monetization-config}}]
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector: {app: api-gateway}
  ports: [{port: 8080, targetPort: 8080}]
