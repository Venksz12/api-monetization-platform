global:
  scrape_interval: 5s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: metering
    static_configs:
      - targets: ["host.docker.internal:9101"]
  - job_name: billing
    static_configs:
      - targets: ["host.docker.internal:9102"]
